services:
  postgres:
    image: postgres:16-alpine
    container_name: df-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./docker/df-app-backend
    container_name: df-app-backend
    environment:
      PORT: "8000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./docker/df-app-frontend
    container_name: df-app-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge